name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install source-test dependencies
        run: python -m pip install -r scripts/requirements-test.txt

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v

      - name: Build reviewed public archive
        if: matrix.python-version == '3.13'
        run: python scripts/build_addon.py

      - name: Verify deterministic archive
        if: matrix.python-version == '3.13'
        run: |
          first="$(shasum -a 256 dist/*.ankiaddon | awk '{print $1}')"
          python scripts/build_addon.py
          second="$(shasum -a 256 dist/*.ankiaddon | awk '{print $1}')"
          test "$first" = "$second"

      - name: Audit archive paths
        if: matrix.python-version == '3.13'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import zipfile

          archive = next(Path("dist").glob("*.ankiaddon"))
          forbidden = re.compile(
              r"(^|/)(profiles?|__pycache__)(/|$)|"
              r"\.(sqlite|sqlite3|db|npy|npz|log|tmp|pyc)$|"
              r"\.DS_Store$"
          )
          with zipfile.ZipFile(archive) as bundle:
              bad = [name for name in bundle.namelist() if forbidden.search(name)]
              assert not bad, bad
              assert bundle.testzip() is None
          PY

  anki-compatibility:
    name: Anki ${{ matrix.anki-version }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - anki-version: "24.11"
            python-version: "3.9"
            aqt-extra: "[qt6]"
            numpy-version: "2.0.2"
            qt-requirements: >-
              pyqt6==6.6.1
              pyqt6-qt6==6.6.2
              pyqt6-sip==13.6.0
              pyqt6-webengine==6.6.0
              pyqt6-webengine-qt6==6.6.2
          - anki-version: "25.2.7"
            python-version: "3.9"
            aqt-extra: ""
            numpy-version: "2.0.2"
            qt-requirements: >-
              pyqt6==6.6.1
              pyqt6-qt6==6.6.2
              pyqt6-sip==13.6.0
              pyqt6-webengine==6.6.0
              pyqt6-webengine-qt6==6.6.2
          - anki-version: "25.7.5"
            python-version: "3.13"
            aqt-extra: "[qt]"
            numpy-version: "2.5.1"
            qt-requirements: ""
          - anki-version: "25.9.4"
            python-version: "3.13"
            aqt-extra: "[qt]"
            numpy-version: "2.5.1"
            qt-requirements: ""
          - anki-version: "25.9.5"
            python-version: "3.13"
            aqt-extra: "[qt]"
            numpy-version: "2.5.1"
            qt-requirements: ""
          - anki-version: "26.5"
            python-version: "3.13"
            aqt-extra: "[qt]"
            numpy-version: "2.5.1"
            qt-requirements: ""
          - anki-version: "26.8"
            python-version: "3.13"
            aqt-extra: "[qt]"
            numpy-version: "2.5.1"
            qt-requirements: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the matching Anki and test runtime
        run: |
          python -m pip install "numpy==${{ matrix.numpy-version }}" ${{ matrix.qt-requirements }}
          python -m pip install \
            "aqt${{ matrix.aqt-extra }}==${{ matrix.anki-version }}"

      - name: Run full suite against Anki
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v

name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install source-test dependencies
        run: python -m pip install -r scripts/requirements-test.txt

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v

      - name: Build reviewed public archive
        if: matrix.python-version == '3.13'
        run: python scripts/build_addon.py

      - name: Verify deterministic archive
        if: matrix.python-version == '3.13'
        run: |
          first="$(shasum -a 256 dist/*.ankiaddon | awk '{print $1}')"
          python scripts/build_addon.py
          second="$(shasum -a 256 dist/*.ankiaddon | awk '{print $1}')"
          test "$first" = "$second"

      - name: Audit archive paths
        if: matrix.python-version == '3.13'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import zipfile

          archive = next(Path("dist").glob("*.ankiaddon"))
          forbidden = re.compile(
              r"(^|/)(profiles?|__pycache__)(/|$)|"
              r"\.(sqlite|sqlite3|db|npy|npz|log|tmp|pyc)$|"
              r"\.DS_Store$"
          )
          with zipfile.ZipFile(archive) as bundle:
              bad = [name for name in bundle.namelist() if forbidden.search(name)]
              assert not bad, bad
              assert bundle.testzip() is None
          PY
